openapi: "3.1.0"
info:
  title: API do CRM AgilizeWeb
  version: "1.0.0"
  description: "API para o Grok Bot (ou outro agente/automação) operar o CRM com segurança. JSON com campos em português; datas ISO 8601; valores como número. Erros sempre em { erro: { codigo, mensagem, detalhes } }. Todo POST aceita Idempotency-Key (24 h). Limite: 60 requisições/min por chave. Não existe DELETE."
servers:
  - url: https://SEU-PROJETO.supabase.co/functions/v1/api/v1
tags:
  - name: Leads
  - name: Fila
  - name: Mensagens
  - name: Aprovação
  - name: Tarefas
  - name: Catálogo
  - name: Vendas e métricas
  - name: Sistema
paths:
  "/health":
    get:
      summary: Status da API
      tags:
        - Sistema
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  status:
                    type: string
                  versao:
                    type: string
      security: []
  "/openapi.json":
    get:
      summary: Esta especificação
      tags:
        - Sistema
      responses:
        "200":
          description: OpenAPI 3.1
      security: []
  "/leads":
    get:
      summary: Listar leads
      tags:
        - Leads
      responses:
        "200":
          description: Página de leads (mais recentes primeiro).
          content:
            "application/json":
              schema:
                type: object
                required:
                  - dados
                  - proximo_cursor
                properties:
                  dados:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lead"
                  proximo_cursor:
                    type:
                      - string
                      - "null"
                    description: Null quando não há mais páginas.
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "429":
          $ref: "#/components/responses/Limite"
      parameters:
        - name: estagio
          in: query
          description: Filtra por estágio.
          schema:
            type: string
            enum:
              - novo
              - abordado
              - respondeu
              - auditoria_enviada
              - proposta_enviada
              - negociacao
              - ganho
              - perdido
              - sem_resposta
        - name: cidade
          in: query
          description: Cidade exata.
          schema:
            type: string
        - name: segmento
          in: query
          description: Segmento exato.
          schema:
            type: string
        - name: tag
          in: query
          description: Leads que têm esta tag.
          schema:
            type: string
        - name: busca
          in: query
          description: Busca em empresa, contato, cidade e telefone.
          schema:
            type: string
        - name: sem_contato_ha_dias
          in: query
          description: Sem contato há pelo menos N dias (inclui nunca contatados).
          schema:
            type: integer
            minimum: 0
        - name: atualizado_desde
          in: query
          description: Só leads alterados desde esta data (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: incluir_arquivados
          in: query
          description: true para incluir arquivados.
          schema:
            type: boolean
        - name: limite
          in: query
          description: Itens por página (1 a 200, padrão 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: cursor
          in: query
          description: Valor de "proximo_cursor" da página anterior.
          schema:
            type: string
      security:
        - chaveApi: []
      x-escopo: leitura
      x-ferramenta:
        nome: listar_leads
        descricao: Lista leads do CRM com filtros (estágio, cidade, segmento, tag, busca, sem contato há N dias). Use para encontrar leads para enriquecer ou acompanhar.
    post:
      summary: Criar ou atualizar lead (upsert pelo WhatsApp)
      description: "Se o WhatsApp já existir, atualiza só os campos enviados e responde criado: false. Nunca reativa opt-out."
      tags:
        - Leads
      responses:
        "200":
          description: Já existia; atualizado.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  criado:
                    const: false
                  lead:
                    $ref: "#/components/schemas/Lead"
        "201":
          description: Criado.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  criado:
                    const: true
                  lead:
                    $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "422":
          $ref: "#/components/responses/Invalido"
        "429":
          $ref: "#/components/responses/Limite"
        "503":
          $ref: "#/components/responses/Pausado"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                empresa:
                  type: string
                  description: Nome da empresa.
                whatsapp:
                  type: string
                  description: WhatsApp em qualquer formato; o servidor normaliza para 55DDDNUMERO.
                  examples:
                    - (19) 99999-9999
                contato_nome:
                  type:
                    - string
                    - "null"
                  description: Nome do contato.
                cidade:
                  type: string
                  description: Cidade.
                uf:
                  type:
                    - string
                    - "null"
                  description: Sigla do estado.
                  examples:
                    - SP
                segmento:
                  type:
                    - string
                    - "null"
                  description: "Segmento (ex.: Ótica, Estética automotiva)."
                origem:
                  type: string
                  enum:
                    - prospeccao_ativa
                    - indicacao
                    - instagram
                    - site
                    - importacao
                    - agente
                  description: "Padrão: agente."
                link_google:
                  type:
                    - string
                    - "null"
                  description: Link do Perfil do Google / Maps.
                site_atual:
                  type:
                    - string
                    - "null"
                  description: Site atual.
                instagram:
                  type:
                    - string
                    - "null"
                  description: Instagram (@perfil ou link).
                nota_auditoria:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 100
                  description: Nota da auditoria do Perfil do Google.
                servico_interesse:
                  type:
                    - string
                    - "null"
                  format: uuid
                  description: Id de um serviço de GET /servicos.
                valor_estimado:
                  type:
                    - number
                    - "null"
                  minimum: 0
                  description: Valor em reais, como número (549.9).
                proxima_acao:
                  type:
                    - string
                    - "null"
                  description: Próxima ação (texto curto).
                proxima_acao_em:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Quando fazer a próxima ação.
                tags:
                  type: array
                  items:
                    type: string
                observacoes:
                  type:
                    - string
                    - "null"
                  description: Observações livres.
                opt_out:
                  type: boolean
                  const: true
                  description: Só aceita true (marcar opt-out). Nunca reativa.
              additionalProperties: false
              required:
                - empresa
                - whatsapp
      security:
        - chaveApi: []
      x-escopo: escrita
      x-ferramenta:
        nome: criar_ou_atualizar_lead
        descricao: "Cadastra um lead novo ou atualiza um existente pelo WhatsApp (upsert). Obrigatórios: empresa e whatsapp. Use também para enriquecer um lead com segmento, links, nota da auditoria etc."
  "/leads/lote":
    post:
      summary: Criar vários leads de uma vez (até 500)
      description: Mesmo relatório da importação CSV. Duplicados (no lote ou já cadastrados) e telefones inválidos são descartados, com o motivo.
      tags:
        - Leads
      responses:
        "200":
          description: Relatório.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  importados:
                    type: integer
                  duplicados:
                    type: integer
                  invalidos:
                    type: integer
                  ids:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        whatsapp:
                          type: string
                  detalhes:
                    type: object
                    description: "duplicados e invalidos: [{ linha, empresa, whatsapp, motivo }]"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "422":
          $ref: "#/components/responses/Invalido"
        "429":
          $ref: "#/components/responses/Limite"
        "503":
          $ref: "#/components/responses/Pausado"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - leads
              properties:
                leads:
                  type: array
                  maxItems: 500
                  items:
                    type: object
                    properties:
                      empresa:
                        type: string
                        description: Nome da empresa.
                      whatsapp:
                        type: string
                        description: WhatsApp em qualquer formato; o servidor normaliza para 55DDDNUMERO.
                        examples:
                          - (19) 99999-9999
                      contato_nome:
                        type:
                          - string
                          - "null"
                        description: Nome do contato.
                      cidade:
                        type: string
                        description: Cidade.
                      uf:
                        type:
                          - string
                          - "null"
                        description: Sigla do estado.
                        examples:
                          - SP
                      segmento:
                        type:
                          - string
                          - "null"
                        description: "Segmento (ex.: Ótica, Estética automotiva)."
                      origem:
                        type: string
                        enum:
                          - prospeccao_ativa
                          - indicacao
                          - instagram
                          - site
                          - importacao
                          - agente
                        description: "Padrão: agente."
                      link_google:
                        type:
                          - string
                          - "null"
                        description: Link do Perfil do Google / Maps.
                      site_atual:
                        type:
                          - string
                          - "null"
                        description: Site atual.
                      instagram:
                        type:
                          - string
                          - "null"
                        description: Instagram (@perfil ou link).
                      nota_auditoria:
                        type:
                          - integer
                          - "null"
                        minimum: 0
                        maximum: 100
                        description: Nota da auditoria do Perfil do Google.
                      servico_interesse:
                        type:
                          - string
                          - "null"
                        format: uuid
                        description: Id de um serviço de GET /servicos.
                      valor_estimado:
                        type:
                          - number
                          - "null"
                        minimum: 0
                        description: Valor em reais, como número (549.9).
                      proxima_acao:
                        type:
                          - string
                          - "null"
                        description: Próxima ação (texto curto).
                      proxima_acao_em:
                        type:
                          - string
                          - "null"
                        format: date-time
                        description: Quando fazer a próxima ação.
                      tags:
                        type: array
                        items:
                          type: string
                      observacoes:
                        type:
                          - string
                          - "null"
                        description: Observações livres.
                      opt_out:
                        type: boolean
                        const: true
                        description: Só aceita true (marcar opt-out). Nunca reativa.
                    additionalProperties: false
                    required:
                      - empresa
                      - whatsapp
                tag:
                  type: string
                  description: "Tag aplicada a todos (ex.: nome da campanha)."
      security:
        - chaveApi: []
      x-escopo: escrita
      x-ferramenta:
        nome: criar_leads_em_lote
        descricao: "Cadastra até 500 leads de uma vez (ex.: uma lista de prospecção). Devolve quantos entraram, quantos eram duplicados e quais telefones estavam inválidos."
  "/eventos":
    get:
      summary: O que mudou desde um momento (sincronização por polling)
      description: Use proximo_desde da resposta na próxima chamada. Para receber em tempo real, peça ao Richard um webhook.
      tags:
        - Sistema
      responses:
        "200":
          description: Eventos em ordem cronológica.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  dados:
                    type: array
                    items:
                      type: object
                      properties:
                        tipo:
                          type: string
                          enum:
                            - lead_criado
                            - lead_atualizado
                            - interacao
                            - acao_decidida
                            - venda_criada
                        ocorreu_em:
                          type: string
                          format: date-time
                        lead_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        dados:
                          type: object
                  proximo_desde:
                    type: string
                    format: date-time
                  tem_mais:
                    type: boolean
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "429":
          $ref: "#/components/responses/Limite"
      parameters:
        - name: desde
          in: query
          description: Obrigatório. Data ISO 8601.
          schema:
            type: string
            format: date-time
        - name: limite
          in: query
          description: "1 a 500 (padrão 200)."
          schema:
            type: integer
            minimum: 1
            maximum: 500
      security:
        - chaveApi: []
      x-escopo: leitura
      x-ferramenta:
        nome: eventos_desde
        descricao: Lista o que mudou no CRM desde um momento (leads criados/alterados, interações, propostas decididas, vendas). Use para saber o que o Richard fez desde a sua última rodada.
  "/leads/{id}":
    get:
      summary: Lead completo com últimas 20 interações e tarefas abertas
      tags:
        - Leads
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                type: object
                properties:
                  lead:
                    $ref: "#/components/schemas/Lead"
                  interacoes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Interacao"
                  tarefas:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tarefa"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "429":
          $ref: "#/components/responses/Limite"
      parameters:
        - name: id
          in: path
          required: true
          description: Id do lead (uuid).
          schema:
            type: string
            format: uuid
      security:
        - chaveApi: []
      x-escopo: leitura
      x-ferramenta:
        nome: obter_lead
        descricao: Traz um lead completo, com as últimas 20 interações (linha do tempo) e tarefas abertas. Use antes de escrever uma mensagem para entender o contexto.
    patch:
      summary: Editar campos do lead
      tags:
        - Leads
      responses:
        "200":
          description: Lead atualizado.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "409":
          description: whatsapp_duplicado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          $ref: "#/components/responses/Invalido"
        "429":
          $ref: "#/components/responses/Limite"
        "503":
          $ref: "#/components/responses/Pausado"
      parameters:
        - name: id
          in: path
          required: true
          description: Id do lead (uuid).
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              properties:
                empresa:
                  type: string
                  description: Nome da empresa.
                whatsapp:
                  type: string
                  description: WhatsApp em qualquer formato; o servidor normaliza para 55DDDNUMERO.
                  examples:
                    - (19) 99999-9999
                contato_nome:
                  type:
                    - string
                    - "null"
                  description: Nome do contato.
                cidade:
                  type: string
                  description: Cidade.
                uf:
                  type:
                    - string
                    - "null"
                  description: Sigla do estado.
                  examples:
                    - SP
                segmento:
                  type:
                    - string
                    - "null"
                  description: "Segmento (ex.: Ótica, Estética automotiva)."
                origem:
                  type: string
                  enum:
                    - prospeccao_ativa
                    - indicacao
                    - instagram
                    - site
                    - importacao
                    - agente
                  description: "Padrão: agente."
                link_google:
                  type:
                    - string
                    - "null"
                  description: Link do Perfil do Google / Maps.
                site_atual:
                  type:
                    - string
                    - "null"
                  description: Site atual.
                instagram:
                  type:
                    - string
                    - "null"
                  description: Instagram (@perfil ou link).
                nota_auditoria:
                  type:
                    - integer
                    - "null"
                  minimum: 0
                  maximum: 100
                  description: Nota da auditoria do Perfil do Google.
                servico_interesse:
                  type:
                    - string
                    - "null"
                  format: uuid
                  description: Id de um serviço de GET /servicos.
                valor_estimado:
                  type:
                    - number
                    - "null"
                  minimum: 0
                  description: Valor em reais, como número (549.9).
                proxima_acao:
                  type:
                    - string
                    - "null"
                  description: Próxima ação (texto curto).
                proxima_acao_em:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: Quando fazer a próxima ação.
                tags:
                  type: array
                  items:
                    type: string
                observacoes:
                  type:
                    - string
                    - "null"
                  description: Observações livres.
                opt_out:
                  type: boolean
                  const: true
                  description: Só aceita true (marcar opt-out). Nunca reativa.
              additionalProperties: false
      security:
        - chaveApi: []
      x-escopo: escrita
      x-ferramenta:
        nome: editar_lead
        descricao: Edita campos de um lead (enriquecimento). Não muda estágio nem arquiva; opt_out só pode ser marcado como true.
  "/leads/por-whatsapp/{numero}":
    get:
      summary: Buscar lead pelo WhatsApp
      tags:
        - Leads
      responses:
        "200":
          description: OK
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "429":
          $ref: "#/components/responses/Limite"
      parameters:
        - name: numero
          in: path
          required: true
          description: Número em qualquer formato.
          schema:
            type: string
      security:
        - chaveApi: []
      x-escopo: leitura
      x-ferramenta:
        nome: buscar_lead_por_whatsapp
        descricao: Encontra o lead dono de um número de WhatsApp (qualquer formato). Use antes de cadastrar para evitar duplicados.
  "/leads/{id}/estagio":
    post:
      summary: Mudar estágio
      description: motivo_perda é obrigatório em perdido. Mudar para ganho vira ação pendente (202) para o Richard aprovar.
      tags:
        - Leads
      responses:
        "200":
          description: Aplicado.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  aplicado:
                    const: true
                  lead:
                    $ref: "#/components/schemas/Lead"
        "202":
          description: Virou ação pendente (ganho).
          content:
            "application/json":
              schema:
                type: object
                properties:
                  aplicado:
                    const: false
                  acao_pendente:
                    $ref: "#/components/schemas/AcaoPendente"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          $ref: "#/components/responses/Invalido"
        "429":
          $ref: "#/components/responses/Limite"
        "503":
          $ref: "#/components/responses/Pausado"
      parameters:
        - name: id
          in: path
          required: true
          description: Id do lead (uuid).
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: object
              required:
                - estagio
              properties:
                estagio:
                  type: string
                  enum:
                    - novo
                    - abordado
                    - respondeu
                    - auditoria_enviada
                    - proposta_enviada
                    - negociacao
                    - ganho
                    - perdido
                    - sem_resposta
                motivo_perda:
                  type: string
                  description: Obrigatório para perdido.
                justificativa:
                  type: string
                  description: Usada quando vira ação pendente (ganho).
      security:
        - chaveApi: []
      x-escopo: escrita
      x-ferramenta:
        nome: mudar_estagio
        descricao: "Move o lead no funil. Perdido exige motivo_perda. Ganho não é aplicado direto: vira proposta para o Richard aprovar."
  "/leads/{id}/arquivar":
    post:
      summary: Arquivar lead (não existe exclusão)
      tags:
        - Leads
      responses:
        "200":
          description: Arquivado.
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Lead"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
          $ref: "#/components/responses/Invalido"
        "429":
          $ref: "#/components/responses/Limite"
        "503":
          $ref: "#/components/responses/Pausado"
      parameters:
        - name: id
          in: path
          required: true
          description: Id do lead (uuid).
          schema:
            type: string
            format: uuid
      security:
        - chaveApi: []
      x-escopo: escrita
      x-ferramenta:
        nome: arquivar_lead
        descricao: Arquiva um lead (duplicado, fora do perfil). Nada é apagado.
  "/leads/{id}/interacoes":
    post:
      summary: Registrar interação
      description: whatsapp_enviado aplica a cadência (como o "Enviei"); whatsapp_recebido tem o mesmo efeito do "Respondeu".
      tags:
        - Leads
      responses:
        "201":
          description: Registrada.
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/Proibido"
        "404":
          description: lead_nao_encontrado
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Erro"
        "422":
