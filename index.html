<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="description" content="CRM da CRESBI: prospecção e acompanhamento de clientes." />
    <link rel="icon" type="image/svg+xml" href="/cresbi-crm/favicon.svg" />
    <link rel="apple-touch-icon" href="/cresbi-crm/apple-touch-icon.png" />
    <link rel="preload" href="/cresbi-crm/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <title>CRESBI CRM</title>
    <script>
      // Aplica o tema antes do React para não piscar. Padrão da marca: escuro.
      try {
        var t = localStorage.getItem('agz-tema');
        document.documentElement.dataset.theme = t === 'light' || t === 'system' ? t : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
