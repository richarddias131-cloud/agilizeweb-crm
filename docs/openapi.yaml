components:
  securitySchemes:
    chaveApi:
      type: http
      scheme: bearer
      bearerFormat: agz_<chave>
      description: Chave gerada em Configurações → API e agente.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Mesma chave em até 24 h devolve a mesma resposta sem duplicar nada. Use um UUID por operação.
      schema:
        type: string
        maxLength: 200
  responses:
    NaoAutenticado:
      description: nao_autenticado / chave_invalida
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Erro"
    Proibido:
      description: escopo_insuficiente / lead_opt_out
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Erro"
    Invalido:
      description: dados_invalidos (veja detalhes.campos)
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Erro"
    Limite:
      description: limite_requisicoes / limite_diario (header Retry-After)
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Erro"
      headers:
        Retry-After:
          schema:
            type: integer
    Pausado:
      description: agente_pausado
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Erro"
  schemas:
    Erro:
      type: object
      required:
        - erro
      properties:
        erro:
          type: object
          required:
            - codigo
            - mensagem
            - detalhes
          properties:
            codigo:
              type: string
              description: "Código estável (ex.: lead_opt_out)."
            mensagem:
              type: string
              description: O que corrigir, em português.
            detalhes:
              type: object
    Lead:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id do lead.
        empresa:
          type: string
        contato_nome:
          type:
            - string
            - "null"
        whatsapp:
          type: string
          description: "Normalizado: 55DDDNUMERO."
        cidade:
          type: string
        uf:
          type:
            - string
            - "null"
        segmento:
          type:
            - string
            - "null"
        origem:
          type: string
        link_google:
          type:
            - string
            - "null"
        site_atual:
          type:
            - string
            - "null"
        instagram:
          type:
            - string
            - "null"
        nota_auditoria:
          type:
            - integer
            - "null"
        servico_interesse:
          type:
            - string
            - "null"
          format: uuid
        valor_estimado:
          type:
            - number
            - "null"
        estagio:
          type: string
          enum:
            - novo
            - abordado
            - respondeu
            - auditoria_enviada
            - proposta_enviada
            - negociacao
            - ganho
            - perdido
            - sem_resposta
        motivo_perda:
          type:
            - string
            - "null"
        proxima_acao:
          type:
            - string
            - "null"
        proxima_acao_em:
          type:
            - string
            - "null"
          format: date-time
        ultimo_contato_em:
          type:
            - string
            - "null"
          format: date-time
        ultima_resposta_em:
          type:
            - string
            - "null"
          format: date-time
          description: Null = nunca respondeu (prospecção fria).
        tentativas_sem_resposta:
          type: integer
        opt_out:
          type: boolean
        arquivado:
          type: boolean
        tags:
          type: array
          items:
            type: string
        observacoes:
          type:
            - string
